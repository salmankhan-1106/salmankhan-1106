name: GitHub Profile 3D Contrib

on:
  schedule:
    # Runs daily at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          # PROFILE_TOKEN = classic PAT with `read:user` + `repo` scopes.
          # Falls back to the built-in token (public contributions only)
          # if the secret hasn't been created yet.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Uncomment the next line if you live in the southern hemisphere
          # SETTING_JSON: ./profile-3d-settings.json

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: regenerate 3D contribution calendar" || exit 0
          git push